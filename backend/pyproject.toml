[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yeyu-gamer-manager"
version = "0.3.4"
description = "YeYu Gamer local Manager API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.4",
  "Pillow==12.3.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[project.scripts]
yeyu-gamer-manager = "yeyu_gamer_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["yeyu_gamer_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
